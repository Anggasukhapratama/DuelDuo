<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gesture Games - Menu</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="menu-container">
    <h1 class="game-title">🎮 Gesture Games</h1>
    <p class="subtitle">Pilih Game & Main Bareng Teman!</p>
    
    <div class="game-cards">
      <div class="game-card">
        <div class="card-icon">👊</div>
        <h2>Punch Battle</h2>
        <p>Pukul target sebanyak-banyaknya! Siapa paling cepat?</p>
        <a href="/punch-battle/" class="play-btn">Main Sekarang</a>
      </div>
      
      <div class="game-card">
        <div class="card-icon">🧮</div>
        <h2>Math Quiz Battle</h2>
        <p>Jawab soal matematika dengan gesture tangan!</p>
        <a href="/math-quiz/" class="play-btn">Main Sekarang</a>
      </div>
    </div>
    
    <div class="info-box">
      <p>💡 <strong>Catatan:</strong> Game ini memerlukan akses webcam untuk deteksi tangan</p>
    </div>
  </div>
</body>
</html>
